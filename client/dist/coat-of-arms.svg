  </defs>
  <!-- Warrior Shield -->
  <path d="M 50 14 C 62 14 70 24 70 42 C 70 65 52 82 50 86 C 48 82 30 65 30 42 C 30 24 38 14 50 14 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5" />
  
  <!-- Crossed Spear and Axe -->
