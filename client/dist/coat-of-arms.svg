  <line x1="80" y1="20" x2="20" y2="80" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

  <!-- Shield Internal Stripes -->
  <!-- Top Gold Section (Mineral Wealth) -->
  <path d="M 33 30 Q 50 25 67 30 L 68 40 Q 50 35 32 40 Z" fill="#F59E0B" />
